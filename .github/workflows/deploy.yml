name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_RECIPES_COLLECTION_ID: ${{ vars.VITE_APPWRITE_RECIPES_COLLECTION_ID }}
          VITE_APPWRITE_PLANS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_PLANS_COLLECTION_ID }}
          VITE_APPWRITE_HISTORY_COLLECTION_ID: ${{ vars.VITE_APPWRITE_HISTORY_COLLECTION_ID }}
          VITE_APPWRITE_TEAM_ID: ${{ vars.VITE_APPWRITE_TEAM_ID }}
          VITE_APPWRITE_LABELS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_LABELS_COLLECTION_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
